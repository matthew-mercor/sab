schema_version = "1.4"
artifacts = ["/app/output"]

[task]
name = "sceneactbench/recon-twin-bedroom"
description = "SceneActBench Reconstruction: rebuild the furniture of a twin bedroom in Blender from 6 reference views with known camera poses."
keywords = ["sceneactbench", "3d", "blender", "reconstruction", "vision", "mcp"]

[metadata]
benchmark = "SceneActBench"
task_type = "task5_recon"
sample = "Twin Bedroom"
source_blend = "twin_bedroom.blend"
golden_items = ["Bed_1", "Bed_2", "Nightstand_1", "Nightstand_2", "Floor_Lamp", "Dresser", "Cabinet", "Shelving_Unit"]
n_golden_objects = 8
n_reference_views = 6
fov_x_deg = 39.6
step_budget_reference = 35
reward_metric = "obj_f@5%_nn (per-object F-score at 5% of object size, after one global alignment)"
golden_reward = 1.0

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1800.0
network_mode = "public"
cpus = 4
memory_mb = 8192
workdir = "/app"

[[environment.mcp_servers]]
name = "blender"
transport = "stdio"
command = "/opt/sceneactbench/blender_mcp_stdio.sh"
args = []

[solution.env]
