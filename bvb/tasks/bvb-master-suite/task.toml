schema_version = "1.3"
artifacts = ["/app/result.blend"]

[task]
name = "local/bvb-master-suite"
description = "A sunlit master bedroom, then its en-suite bathroom (Pexels video 7578550)"
authors = [{ name = "Matthew" }]
keywords = ["blender", "bpy", "video", "3d-reconstruction", "spatial-reasoning", "vision", "bvb"]

[metadata]
category = "video-to-3d"
benchmark = "BVB (Blender-VideoBench), Dual VQA retention"
difficulty_explanation = "Reconstruct a real indoor video as an animated Blender scene built from primitives, including the camera path; graded by how many held-back spatial questions a judge still answers correctly on a render of the scene."
source_video_seconds = 16.03
questions_total = 13
questions_counted = 13
judge_model = "alibaba/qwen3-vl-instruct"
judge_base_url = "https://ai-gateway.vercel.sh/v1"
judge_votes = 5
golden_floor = 0.8

[verifier]
timeout_sec = 7200.0
environment_mode = "separate"
# The judge is an API model: the verifier may reach only the judge's host.
network_mode = "allowlist"
allowed_hosts = ["ai-gateway.vercel.sh"]

[verifier.env]
JUDGE_API_KEY = "${VERCEL_AI_GATEWAY_API_KEY}"

[agent]
timeout_sec = 3600
# Deny model-time egress unless the run config supplies the model provider via
# agent.extra_allowed_hosts (or --allow-agent-host).
network_mode = "no-network"

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
network_mode = "public"
